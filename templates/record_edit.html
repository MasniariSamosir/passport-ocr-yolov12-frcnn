{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto p-6 bg-gray-900 text-white rounded-lg shadow-lg">

    <h2 class="text-2xl font-semibold mb-6 text-center">
        Edit Data OCR — ID {{ data.id }}
    </h2>

    <form method="POST">

        <label class="block mb-2 font-semibold">Surname</label>
        <input name="surname" value="{{ data.surname }}" 
               class="w-full px-3 py-2 mb-4 rounded bg-gray-800 text-white border border-gray-600"/>

        <label class="block mb-2 font-semibold">Given Names</label>
        <input name="given_names" value="{{ data.given_names }}" 
               class="w-full px-3 py-2 mb-4 rounded bg-gray-800 text-white border border-gray-600"/>

        <label class="block mb-2 font-semibold">Passport Number</label>
        <input name="passport_number" value="{{ data.passport_number }}" 
               class="w-full px-3 py-2 mb-4 rounded bg-gray-800 text-white border border-gray-600"/>
       
       <div class="mb-4">
              <label class="font-semibold block mb-1">Update Photo (optional)</label>
              <input type="file" name="photo" accept="image/*"
                     class="block w-full bg-gray-900 text-white border border-gray-700 p-2 rounded">
              </div>

              {% if data.photo_path %}
              <div class="mb-4">
              <p class="font-semibold mb-1">Current Photo:</p>
              <img src="/{{ data.photo_path }}" class="w-48 rounded shadow">
              </div>
              {% endif %}


        <label class="block mb-2 font-semibold">Nationality</label>
        <input name="nationality" value="{{ data.nationality }}" 
               class="w-full px-3 py-2 mb-4 rounded bg-gray-800 text-white border border-gray-600"/>

        <label class="block mb-2 font-semibold">Place of Birth</label>
        <input name="place_of_birth" value="{{ data.place_of_birth }}" 
               class="w-full px-3 py-2 mb-4 rounded bg-gray-800 text-white border border-gray-600"/>

        <label class="block mb-2 font-semibold">Sex</label>
        <input name="sex" value="{{ data.sex }}" 
               class="w-full px-3 py-2 mb-4 rounded bg-gray-800 text-white border border-gray-600"/>

        <label class="block mb-2 font-semibold">Date of Birth (YYYY-MM-DD)</label>
        <input name="date_of_birth" value="{{ data.date_of_birth }}" 
               class="w-full px-3 py-2 mb-4 rounded bg-gray-800 text-white border border-gray-600"/>

        <label class="block mb-2 font-semibold">Date of Issue (YYYY-MM-DD)</label>
        <input name="date_of_issue" value="{{ data.date_of_issue }}" 
               class="w-full px-3 py-2 mb-4 rounded bg-gray-800 text-white border border-gray-600"/>

        <label class="block mb-2 font-semibold">Date of Expiry (YYYY-MM-DD)</label>
        <input name="date_of_expiry" value="{{ data.date_of_expiry }}" 
               class="w-full px-3 py-2 mb-4 rounded bg-gray-800 text-white border border-gray-600"/>

        <button type="submit"
                class="mt-6 w-full bg-blue-600 hover:bg-blue-700 py-2 rounded text-white font-semibold">
            Update Record
        </button>

    </form>

</div>
{% endblock %}
